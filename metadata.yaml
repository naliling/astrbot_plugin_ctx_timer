name: astrbot_plugin_ctx_timer
display_name: CTEX伴侣
short_desc: 到点自动注入上下文，时间一到自动生效，过点自动撤下
desc: >
  把一段文字在固定时间注入上下文，过点自动撤下。

  · 一条规则 = 一段文字 + 开始时间 + 关闭时间
  · 可以加多条，每个 Bot 一套独立规则
  · 纯指令管理：添加 / 查看 / 修改 / 开关 / 删除

  装上是空的，你不写规则它就不动。
version: 1.0.1.6
author: 娜莉灵

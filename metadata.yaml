name: astrbot_plugin_ctx_timer
display_name: CTEX伴侣
short_desc: 到点自动注入上下文，时间一到自动生效，过点自动撤下
desc: >
  一个上下文注入插件：把一段文字在固定时间注入到上下文里。

  给它一段话、一个开始时间、一个关闭时间，就是一条规则：
  进入时段，这段话自动注入给模型；出了时段，自动撤掉，不留痕迹。

  可以加很多条，各管各的时间段，到点自动生效；
  每个 Bot 一套独立规则库，互不影响；
  纯指令管理，添加、查看、修改、开关、删除都是发指令；
  装上是空的，不写规则它什么都不做。

  常见用法：凌晨换人格、上班下班两套语气、活动期间固定说法、强制按原设定回应（防 OOC）。
version: 1.0.1.6
author: 娜莉灵

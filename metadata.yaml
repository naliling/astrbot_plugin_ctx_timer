name: astrbot_plugin_ctx_timer
display_name: CTEX伴侣
short_desc: 到点自动注入上下文，时间一到自动生效，过点自动撤下
desc: >
  到点自动改 AI 的行为，不用手动、不用重启。

  给每个 Bot 建一套独立的定时上下文：写一段话，设一个开始时间、一个关闭时间。
  进入时段，这段话自动注入给模型；出了时段，自动撤掉。
  凌晨换人格、上班下班两套语气、活动期间临时加规矩、节日彩蛋，全都按时自动生效。

  支持每日循环与一次性、上下文注入与系统提示词两种位置、指定群聊生效、多时区、
  多规则并存、纯指令管理、可选到点提醒、规则导出导入。仅管理员可用。
version: 1.0.1.2
author: 娜莉灵
repo: https://github.com/naliling/astrbot_plugin_ctx_timer
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
